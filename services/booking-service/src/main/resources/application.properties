spring.application.name=booking-service
spring.config.import=configserver:http://localhost:8888
spring.cloud.config.label=main

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=create-drop

# How long a seat stays held while the (simulated) payment is pending.
# Documented in the README; overridable from the Config Server.
ticketflow.booking.hold-duration=PT15M
# How often overdue holds are swept and their seats released.
ticketflow.booking.sweep-interval=60000

# Empty by default: event-service is resolved through Eureka. Set EVENT_SERVICE_URL
# (e.g. http://localhost:8082) only to bypass Eureka while working on one service.
ticketflow.clients.event-service.url=${EVENT_SERVICE_URL:}

# Remote read budget for the OpenFeign calls to event-service. Overridable from the
# Config Server; never wait forever for another service.
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=3000

# Circuit breaker around EventClient#getById(Long): when event-service keeps failing the
# call is refused locally instead of piling up timeouts. One circuit per client (group).
spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.circuitbreaker.group.enabled=true
resilience4j.circuitbreaker.instances.EventClientgetByIdLong.sliding-window-size=10
resilience4j.circuitbreaker.instances.EventClientgetByIdLong.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.EventClientgetByIdLong.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.EventClientgetByIdLong.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.EventClientgetByIdLong.permitted-number-of-calls-in-half-open-state=3
# A 404 (unknown event) and a 400 are legitimate answers: they are counted neither as a
# success nor as a failure, so a series of 404s can never open the circuit.
resilience4j.circuitbreaker.instances.EventClientgetByIdLong.ignore-exceptions=feign.FeignException$NotFound,feign.FeignException$BadRequest
resilience4j.timelimiter.configs.default.timeout-duration=4s
