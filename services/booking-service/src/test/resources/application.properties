# Test-only overrides: make Config Server optional and disable Eureka.
# This file replaces src/main/resources/application.properties on the test classpath.
spring.config.import=optional:configserver:http://localhost:8888
spring.cloud.config.enabled=false
eureka.client.enabled=false
server.port=0
management.endpoints.web.exposure.include=health,info

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=create-drop

ticketflow.booking.hold-duration=PT15M
ticketflow.booking.sweep-interval=60000
