spring.application.name=customer-service
spring.config.import=configserver:http://localhost:8888
spring.cloud.config.label=main

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=create-drop

spring.cloud.refresh.never-refreshable=com.zaxxer.hikari.HikariDataSource,org.springframework.cloud.netflix.eureka.EurekaInstanceConfigBean,org.springframework.cloud.netflix.eureka.EurekaClientConfigBean
